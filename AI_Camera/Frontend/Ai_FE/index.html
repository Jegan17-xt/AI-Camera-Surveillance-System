<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / installability — deliberately NO static <link rel="manifest">
         here. This is one SPA (one index.html, client-side routing only),
         so a manifest linked here would apply to every route, including
         the public Landing page and /user/login — exactly what must NOT
         be installable. src/components/DynamicManifestLink.jsx swaps the
         real manifest <link> in and out of <head> per-route instead:
         manifest-admin.webmanifest on /admin/*, manifest-super-admin.
         webmanifest on /super-admin/*, none anywhere else. See
         mobile-twa/README.md for the two native TWA Android apps those
         feed into, and public/sw.js (registered in main.jsx) for the
         site-wide offline/caching service worker, unrelated to
         installability by itself. -->
    <meta name="theme-color" content="#05070d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zynez" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>AI Sentinel — Surveillance Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
