<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Same app, same bundle (/src/main.jsx below) as index.html — see
         admin.html's comment for the full reasoning. This is the
         Super Admin counterpart: .htaccess routes every real, fresh
         navigation under /super-admin/* to THIS file instead of
         index.html so manifest-super-admin.webmanifest is present in
         the initial HTML, satisfying Android Chrome's "Install app"
         criteria the same way admin.html does for /admin/* — see that
         file's comment for why id="zx-dynamic-manifest" matters here
         too (DynamicManifestLink.jsx takes over this exact element
         instead of creating a duplicate). -->
    <link id="zx-dynamic-manifest" rel="manifest" href="/manifest-super-admin.webmanifest" />
    <meta name="theme-color" content="#05070d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zynez Super Admin" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>AI Sentinel — Surveillance Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
